services:
  - type: web
    name: chatjimmy-api
    runtime: python
    buildCommand: pip install -e ".[server]"
    startCommand: uvicorn chatjimmy.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_KEY
        generateValue: true
      - key: CHATJIMMY_BASE_URL
        value: https://chatjimmy.ai
      - key: CHATJIMMY_TIMEOUT
        value: 30
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /health
    autoDeploy: true
